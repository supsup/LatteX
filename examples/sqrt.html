<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LatteX — square root</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; min-height: 100vh;
           display: grid; place-items: center; background: #f4f6f6; color: #1a1f21; }
    main { text-align: center; padding: 3rem 1.5rem; }
    .eyebrow { font-family: ui-monospace, monospace; font-size: .72rem; letter-spacing: .18em;
               text-transform: uppercase; color: #1f7d72; margin: 0 0 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem; max-width: 900px; }
    /* min-width:0 lets a grid item shrink below its content; without it the card
       grows to fit a wide formula and the max-width below resolves against a box
       that has already expanded. box-sizing keeps the 2.5rem padding inside the
       column rather than adding to it. */
    .card { display: inline-flex; flex-direction: column; align-items: center; gap: 1.25rem;
            background: #fff; border: 1px solid #e3e8e7; border-radius: 14px;
            padding: 2rem 2.5rem; box-shadow: 0 6px 24px rgba(0,0,0,.06);
            min-width: 0; max-width: 100%; box-sizing: border-box; }
    .src { font-family: ui-monospace, monospace; font-size: .9rem; color: #3a4749;
           background: #eef2f1; border: 1px solid #e0e6e4; border-radius: 7px; padding: .4rem .8rem; }
    /* CONTAIN, do not fix one axis. `height:120px; width:auto` scaled a wide
       formula to a fixed height and let its width run past the card: at a 204px
       card, any viewBox wider than ~1.7:1 spilled, and `a + b = c` (4.65:1) put
       177px over EACH edge onto the page background. Constraining both axes with
       auto sizing preserves the viewBox aspect ratio and fits inside whichever
       limit binds first. */
    .render { width: 100%; }
    .render svg { max-width: 100%; max-height: 120px; width: auto; height: auto;
                  display: block; margin: 0 auto; }
    figcaption { font-family: ui-monospace, monospace; font-size: .62rem; letter-spacing: .08em;
                 text-transform: uppercase; color: #8a9896; max-width: 22ch; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LatteX &middot; S4 layout</p>
        <figure class="card">
          <span class="src">\sqrt{x^2+1}</span>
          <div class="render">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.28 -43.756 139.6378 51.48" width="139.6378" height="51.48" role="img" aria-label="the square root of x squared + 1">
              <g fill="currentColor">
                <path d="M667 922 L829 922 L829 854 L713 854 L413 -265 L371 -265 L138 319 L34 279 L18 307 L177 417 L197 417 L395 -93 L399 -93 L667 922 Z" transform="translate(0 -4.876) scale(0.04 -0.04)"/>

                <path d="M658 225 L396 225 L396 -40 L324 -40 L324 225 L62 225 L62 293 L324 293 L324 558 L396 558 L396 293 L658 293 L658 225 Z" transform="translate(78.8689 0) scale(0.04 -0.04)"/>
                <path d="M426 0 L80 0 L80 28 Q151 28 180 43 Q209 58 209 95 L209 518 Q209 544 202 555 Q195 567 176 567 Q161 567 129 563 Q97 559 74 551 L74 584 L268 639 L297 639 L297 95 Q297 58 327 43 Q357 28 426 28 L426 0 Z" transform="translate(116.5578 0) scale(0.04 -0.04)"/>

            </svg>
          </div>
          <figcaption>a radical: surd glyph + over-bar clearing the radicand</figcaption>
        </figure>
  </main>
</body>
</html>
