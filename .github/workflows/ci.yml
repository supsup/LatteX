# LatteX CI — every push/PR runs the FULL gate: build (incl. javadoc, the
# release path), the whole test suite, and the BrewShot real-browser pins
# (blob audit, fx lifecycle, GIF liveness). The pins are REQUIRED here, not
# assumed: a verify step proves Chrome is present and LATTEX_REQUIRE_BROWSER=1
# turns an availability skip into a build FAILURE — a runner-image regression
# must go red, never green-minus-the-safety-net (review lattex 246 F2).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on PRs AND on pushes to main. PR-only meant a change landed on main
  # (direct push, or a merge whose result differs from the PR's merge
  # candidate) never passed this gate (plan 1615d52b).
  exported-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 for the base..head diff this job actually needs: on a
          # PR the base sha, on a push to main github.event.before. Full history
          # makes both reachable without guessing a depth.
          #
          # fetch-tags IS NOT NEEDED BY THIS JOB TODAY — it is here so this
          # checkout stops being a TRAP (review lattex/830, Confluence). A bare
          # `fetch-depth: 0` LOOKS tag-capable and is not: checkout sends
          # `--no-tags` whenever fetch-tags is false, REGARDLESS of depth. So this
          # job would hand a tag-derived check an empty `git tag`, and that check
          # would report "no release tag exists" while the tag sat on the remote.
          # That exact failure cost the build job below two review rounds, and this
          # was the same configuration one job up. Defusing it beats documenting
          # it: the next person who adds a tag-derived check here should simply
          # have it work.
          # DO NOT REMOVE AS UNUSED — being unused is the entire point.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prove the exported-surface detector fires and clears causally
        run: tools/exported-api/self-test.sh
      - name: Reject undeclared public/protected additions in exported packages
        # PR: base = the PR base sha (unchanged). Push to main: base = the
        # pre-push tip (github.event.before). A missing or all-zero `before`
        # (new ref, some force pushes) has no base to compare against, so the
        # job FAILS rather than skips: a skipped gate on main is the hole this
        # job exists to close. An unreachable `before` (force push that dropped
        # it) also fails, via the explicit check below.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          TIP_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            if [ -z "$base" ] || [ -z "${base//0/}" ]; then
              echo "::error::exported-surface: push has no usable base (github.event.before='$base'). Refusing to skip the gate; run tools/exported-api/check.sh against the last gated main commit by hand."
              exit 1
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::exported-surface: base commit $base is not in the checkout (force push?). Refusing to skip the gate."
            exit 1
          fi
          tools/exported-api/check.sh "$base" "$TIP_SHA"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # THIS SUITE READS RELEASE TAGS, AND CHECKOUT DOES NOT FETCH THEM BY DEFAULT
          # (review lattex/828). VersionIdentityGuardTest and ReleaseDocVersionPinTest both
          # derive from `git tag`; a bare checkout leaves the work tree with ZERO tags, so
          # ReleaseDocVersionPinTest reds on EVERY run, and VersionIdentityGuardTest reds at
          # the release cut while blaming a missing tag that is present on the remote.
          #
          # BOTH INPUTS ARE REQUIRED, and each one alone is a fix that silently isn't one.
          # Measured by replaying the real fetch sequence, not reasoned:
          #
          #   fetch-tags alone is not enough. checkout sends --no-tags when fetch-tags is
          #   false, so depth-0 keeps full history and STILL gets no tags. And with depth 1,
          #   git only follows tags that point AT a fetched commit — so a branch or PR whose
          #   tip is not itself the tagged commit fetches nothing, which is every run except
          #   the release commit.
          #
          #   fetch-depth alone is not enough either, for the --no-tags reason above.
          #
          # Against the real remote (main @2750181, tagged lattex-0.12.0), and against this
          # branch tip (NOT a tagged commit) — the second column is the one that matters,
          # because it is the ordinary case:
          #                              at the tagged commit | at an untagged branch tip
          #     --no-tags --depth=1              0 tags       |   0 tags   <- before this fix
          #     --depth=1  + fetch-tags          lattex-0.12.0|   0 tags   <- the trap
          #     --no-tags   (depth 0)            0 tags       |   0 tags
          #     depth 0    + fetch-tags          lattex-0.12.0|   lattex-0.12.0
          #
          # The middle row is why the table is here. Probing only at the tagged commit says
          # fetch-tags alone works — it is the single case where it does. End-to-end proof:
          # in a tagless clone of this branch, ReleaseDocVersionPinTest FAILS; fetch the tags
          # into that same clone and it passes.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Chrome present (the pins REQUIRE it; no silent skip)
        run: google-chrome --version
      - name: Build + full suite (javadoc, containment, corpus, browser pins REQUIRED)
        run: ./gradlew build --no-daemon
        env:
          LATTEX_REQUIRE_BROWSER: '1'
      - name: Clean-tree gate (the hermetic-suite proof — plan 32148cc8 S3)
        # `test` must not touch the working tree: the examples/ generators write into
        # build/examples under `test` (only generateExamples writes tracked examples/),
        # BrewShot captures land in build/. Any change here — a modified TRACKED file
        # OR a NEW untracked one — means a test wrote into the checkout, so fail the
        # build. `git diff --exit-code` alone IGNORES untracked files (reviewer F3),
        # so gate on `git status --porcelain` being empty, which catches both.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Test run dirtied the working tree — the suite is not hermetic."
            echo "Offending paths (git status --porcelain):"
            git status --porcelain
            echo "Tracked-file changes (git diff):"
            git diff
            exit 1
          fi
      - name: Upload visual references (BrewShot captures from the test run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brewshot-refs
          path: build/brewshot-refs/
          if-no-files-found: ignore
          retention-days: 14
